<!--
    Minimal Character Counter
    Author: Rohit Vadher
    Version: 1.0
    Stack: HTML, CSS, Vanilla JavaScript
-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minimal Character Counter</title>

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      :root {
        --bg: #f5f7fb;
        --card: #ffffff;
        --border: #e5e7eb;
        --text: #111827;
        --muted: #6b7280;
        --hover: #f3f4f6;
        --shadow: 0 10px 30px rgba(17, 24, 39, 0.04);
        --radius-lg: 24px;
        --radius-md: 16px;
        --transition: 160ms ease;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px;
      }

      .app {
        width: 100%;
        max-width: 1200px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 28px 32px;
        border-bottom: 1px solid var(--border);
      }

      .title {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .subtitle {
        font-size: 13px;
        color: var(--muted);
        margin-top: 4px;
        font-weight: 400;
      }

      .editor {
        width: 100%;
        min-height: 520px;
        border: none;
        outline: none;
        resize: none;
        padding: 32px;
        background: transparent;
        color: var(--text);
        font-size: 16px;
        line-height: 1.8;
        font-family: inherit;
        transition: box-shadow var(--transition);
      }

      .editor::placeholder {
        color: #9ca3af;
      }

      .editor:focus {
        box-shadow: inset 0 0 0 1px rgba(17, 24, 39, 0.06);
      }

      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 24px;
        padding: 24px 32px 32px;
        border-top: 1px solid var(--border);
        flex-wrap: wrap;
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }

      .stat {
        min-width: 140px;
        background: #fafafa;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 16px 18px;
      }

      .stat-label {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-weight: 500;
      }

      .stat-value {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.03em;
        opacity: 1;
        transform: translateY(0);
        transition:
          opacity 140ms ease,
          transform 140ms ease;
      }

      .stat-value.updating {
        opacity: 0.55;
        transform: translateY(-1px);
      }

      .actions {
        display: flex;
        gap: 12px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 14px 18px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: white;
        color: var(--text);
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition:
          background var(--transition),
          border-color var(--transition),
          transform var(--transition);
      }

      .button:hover {
        background: var(--hover);
      }

      .button:active {
        transform: translateY(1px);
      }

      .button:focus-visible {
        outline: 2px solid rgba(17, 24, 39, 0.12);
        outline-offset: 2px;
      }

      .shortcuts {
        width: 100%;
        display: flex;
        gap: 18px;
        margin-top: 8px;
        color: var(--muted);
        font-size: 12px;
        flex-wrap: wrap;
      }

      .shortcut-key {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 4px 8px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: white;
        font-size: 11px;
        font-weight: 600;
        color: var(--text);
        margin-right: 6px;
      }

      @media (max-width: 980px) {
        body {
          padding: 20px;
        }

        .footer {
          flex-direction: column;
          align-items: stretch;
        }

        .actions {
          width: 100%;
        }

        .button {
          flex: 1;
          justify-content: center;
        }

        .stat {
          min-width: calc(50% - 10px);
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div>
          <div class="title">
            <i data-lucide="type"></i>
            <span>Text Counter</span>
          </div>
          <div class="subtitle">Fast, focused and distraction-free.</div>
        </div>
      </header>

      <textarea
        id="editor"
        class="editor"
        placeholder="Start typing or paste your text here..."
        spellcheck="false"
        autofocus
      ></textarea>

      <footer class="footer">
        <section class="stats">
          <article class="stat">
            <div class="stat-label">Characters</div>
            <div class="stat-value" id="characters">0</div>
          </article>

          <article class="stat">
            <div class="stat-label">Words</div>
            <div class="stat-value" id="words">0</div>
          </article>

          <article class="stat">
            <div class="stat-label">Sentences</div>
            <div class="stat-value" id="sentences">0</div>
          </article>

          <article class="stat">
            <div class="stat-label">Paragraphs</div>
            <div class="stat-value" id="paragraphs">0</div>
          </article>

          <article class="stat">
            <div class="stat-label">Spaces</div>
            <div class="stat-value" id="spaces">0</div>
          </article>
        </section>

        <section class="actions">
          <button class="button" id="copyButton" type="button">
            <i data-lucide="copy"></i>
            <span>Copy Text</span>
          </button>

          <button class="button" id="clearButton" type="button">
            <i data-lucide="trash-2"></i>
            <span>Clear All</span>
          </button>
        </section>

        <div class="shortcuts">
          <div>
            <span class="shortcut-key">Ctrl + Shift + C</span>
            Copy all text
          </div>

          <div>
            <span class="shortcut-key">Ctrl + Delete</span>
            Clear all
          </div>
        </div>
      </footer>
    </main>

    <script>
      "use strict";

      // --------------------------------------------------
      // DOM References
      // --------------------------------------------------

      const editor = document.getElementById("editor");

      const statElements = {
        characters: document.getElementById("characters"),
        words: document.getElementById("words"),
        sentences: document.getElementById("sentences"),
        paragraphs: document.getElementById("paragraphs"),
        spaces: document.getElementById("spaces"),
      };

      const copyButton = document.getElementById("copyButton");
      const clearButton = document.getElementById("clearButton");

      // --------------------------------------------------
      // Utility Functions
      // --------------------------------------------------

      // Safely returns regex match count
      const getMatchCount = (text, regex) => {
        const matches = text.match(regex);
        return matches ? matches.length : 0;
      };

      // --------------------------------------------------
      // Counting Engine
      // --------------------------------------------------

      const calculateStats = (text) => {
        // Character count includes spaces and line breaks
        const characters = text.length;

        // Word count:
        // Handles tabs, spaces, new lines and avoids empty splits
        const trimmedText = text.trim();
        const words = trimmedText ? trimmedText.match(/\S+/g).length : 0;

        // Sentence count:
        // Counts logical sentence endings without overcounting
        const sentences = getMatchCount(text, /[.!?]+(?=\s|$)/g);

        // Paragraph count:
        // Ignores empty or whitespace-only lines
        const paragraphs = trimmedText
          ? text.split(/\n+/).filter((paragraph) => paragraph.trim() !== "")
              .length
          : 0;

        // Space count:
        // Counts only actual spaces for precision
        const spaces = getMatchCount(text, / /g);

        return {
          characters,
          words,
          sentences,
          paragraphs,
          spaces,
        };
      };

      // --------------------------------------------------
      // UI Update Helpers
      // --------------------------------------------------

      const animateValue = (element, value) => {
        // Skip unnecessary DOM updates
        if (element.textContent === String(value)) {
          return;
        }

        element.classList.add("updating");

        requestAnimationFrame(() => {
          element.textContent = value;

          setTimeout(() => {
            element.classList.remove("updating");
          }, 140);
        });
      };

      const updateStats = () => {
        const text = editor.value;
        const stats = calculateStats(text);

        Object.entries(stats).forEach(([key, value]) => {
          animateValue(statElements[key], value);
        });
      };

      // --------------------------------------------------
      // Button Actions
      // --------------------------------------------------

      const copyText = async () => {
        try {
          await navigator.clipboard.writeText(editor.value);

          const label = copyButton.querySelector("span");
          const originalText = label.textContent;

          label.textContent = "Copied";

          setTimeout(() => {
            label.textContent = originalText;
          }, 1200);
        } catch (error) {
          console.error("Copy failed:", error);
        }
      };

      const clearText = () => {
        editor.value = "";
        updateStats();
        editor.focus();
      };

      // --------------------------------------------------
      // Event Listeners
      // --------------------------------------------------

      // Uses requestAnimationFrame for smoother updates
      let animationFrameId = null;

      editor.addEventListener("input", () => {
        if (animationFrameId) {
          cancelAnimationFrame(animationFrameId);
        }

        animationFrameId = requestAnimationFrame(() => {
          updateStats();
        });
      });

      copyButton.addEventListener("click", copyText);
      clearButton.addEventListener("click", clearText);

      // --------------------------------------------------
      // Keyboard Shortcuts
      // --------------------------------------------------

      document.addEventListener("keydown", (event) => {
        const isCtrl = event.ctrlKey || event.metaKey;

        // Ctrl + Shift + C → Copy all text
        if (isCtrl && event.shiftKey && event.key.toLowerCase() === "c") {
          event.preventDefault();
          copyText();
        }

        // Ctrl + Delete → Clear all
        if (isCtrl && event.key === "Delete") {
          event.preventDefault();
          clearText();
        }
      });

      // --------------------------------------------------
      // Initialization
      // --------------------------------------------------

      lucide.createIcons();
      updateStats();
    </script>
  </body>
</html>
